# Machine-readable requirement register for PRISMA.
# Checked by tools/validate_requirements.py in CI.
# Allowed status: draft | review | approved | baselined | implemented | verified | rejected | superseded
# Allowed priority: must | should | may

meta:
  project: PRISMA
  organisation: Regionalverkehr Bernland AG
  document_version: "1.4"
  language_of_record: de
  last_baseline: baseline/srs-v1.4

business_requirements:
  - id: BR-01
    title: Single authoritative disruption record
    priority: must
    status: baselined
    metric: Share of disruptions with identical core content across all channels
    baseline: "73 %"
    target: ">= 99 %"
    verification: Automated weekly content diff across channels
    stakeholders: [STK-01, STK-02, STK-04, STK-06]
  - id: BR-02
    title: Speed from incident to passenger
    priority: must
    status: baselined
    metric: Median latency incident to visible message
    baseline: "11 min 40 s"
    target: "<= 3 min median, <= 8 min p95"
    verification: Timestamp comparison over rolling 3-month window
    stakeholders: [STK-01, STK-06, STK-08]
  - id: BR-03
    title: Concession-compliant data delivery
    priority: must
    status: baselined
    metric: Monthly feed availability and conformance result
    baseline: "no feed"
    target: ">= 99.5 % availability, conformance passed"
    verification: Platform monitoring plus operator conformance suite
    stakeholders: [STK-08, STK-09, STK-10]
  - id: BR-04
    title: Lower authoring effort in the control centre
    priority: must
    status: baselined
    metric: Average hands-on authoring time per disruption
    baseline: "6 min 20 s"
    target: "<= 2 min"
    verification: Time study over 40 disruptions after rollout
    stakeholders: [STK-01, STK-02]
  - id: BR-05
    title: Wider real-time coverage without ITCS replacement
    priority: should
    status: baselined
    metric: Share of the 412 stops receiving real-time data
    baseline: "14.8 %"
    target: ">= 45 % at rollout, 100 % without code change"
    verification: Asset register reconciliation and architecture review
    stakeholders: [STK-06, STK-08, STK-14]
  - id: BR-06
    title: Equal access to information
    priority: must
    status: baselined
    metric: Conformance audit result and assistive-technology task success
    baseline: "partially conformant"
    target: "full conformance, >= 90 % task success"
    verification: External accessibility audit signed off by STK-15
    stakeholders: [STK-07, STK-15]
  - id: BR-07
    title: Multilingual service area
    priority: must
    status: baselined
    metric: Share of disruptions available in four languages within 60 s
    baseline: "12 %"
    target: ">= 98 %"
    verification: Publication log analysis
    stakeholders: [STK-04, STK-06, STK-08]
  - id: BR-08
    title: Fewer information-related complaints
    priority: should
    status: baselined
    metric: Complaints categorised as information per year
    baseline: "1340"
    target: "<= 670"
    verification: Customer service report 12 months after rollout
    stakeholders: [STK-01, STK-04, STK-08]
  - id: BR-09
    title: Auditable communication history
    priority: must
    status: baselined
    metric: Share of sampled historic disruptions fully reconstructable
    baseline: "not possible"
    target: "100 % of sampled cases, 3 year retention"
    verification: Audit exercise on 20 random historic disruptions
    stakeholders: [STK-01, STK-08, STK-09]
  - id: BR-10
    title: No covert performance monitoring
    priority: must
    status: baselined
    metric: Presence of driver-identifying attributes in stored or exported data
    baseline: "not assessed"
    target: "zero outside the 24 h operational window, DPIA approved"
    verification: DPIA sign-off and schema inspection by STK-11 and STK-13
    stakeholders: [STK-11, STK-13]

functional_requirements:
  - id: FR-001
    title: Import planned timetable via NeTEx
    parents: [BR-02]
    priority: must
    status: baselined
    use_cases: []
    acceptance: ["Given a valid NeTEx file at 02:00, when the import runs, then 14 days of trips are available before 02:30 and the result is logged"]
    verification: [TC-03]
  - id: FR-002
    title: Reject invalid timetable import and alert
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Given a malformed file, when the import runs, then existing data is unchanged and an alert is raised within 5 min"]
    verification: [TC-03]
  - id: FR-003
    title: Subscribe to ITCS vehicle and trip data
    parents: [BR-02, BR-05]
    priority: must
    status: baselined
    acceptance: ["Given an active VDV 453 subscription, when a position update is emitted, then PRISMA processes it within 10 s"]
    verification: [TC-03]
  - id: FR-004
    title: Mark estimates stale after 90 s without input
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Given a trip whose last update is 91 s old, when departures are requested, then the estimate is marked stale with its age"]
    verification: [TC-14]
  - id: FR-005
    title: Calculate estimated departure times
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Given trip progress and planned times, when an estimate is requested, then a departure estimate per stop is returned"]
    verification: [TC-03]
  - id: FR-006
    title: Recalculate estimates within 5 s of new input
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Given new trip progress, when 5 s have elapsed, then downstream consumers see the updated estimate"]
    verification: [TC-03, TC-02]
  - id: FR-007
    title: Create a disruption with mandatory attributes
    parents: [BR-01, BR-04]
    priority: must
    status: baselined
    use_cases: [UC-001]
    acceptance: ["Given an authenticated dispatcher, when a mandatory attribute is missing, then the disruption cannot leave status draft"]
    verification: [TC-01]
  - id: FR-008
    title: Message templates with bounded free-text slot
    parents: [BR-04, BR-07]
    priority: must
    status: baselined
    use_cases: [UC-001]
    acceptance: ["Given a selected cause, when the text field opens, then the template is pre-filled and free text is limited to 240 characters with a live counter"]
    verification: [TC-05, TC-09]
  - id: FR-009
    title: Restrict cause to the standardised taxonomy
    parents: [BR-01, BR-03]
    priority: must
    status: baselined
    use_cases: [UC-001]
    acceptance: ["Given the cause field, when a value outside the taxonomy is submitted, then it is rejected"]
    verification: [TC-04]
  - id: FR-010
    title: Approval required for major and severe severity
    parents: [BR-01]
    priority: must
    status: baselined
    use_cases: [UC-002]
    acceptance: ["Given severity major, when the dispatcher releases, then status becomes awaiting_approval and the duty officer is notified", "Given severity minor, when the dispatcher releases, then publication proceeds without approval"]
    verification: [TC-07]
  - id: FR-011
    title: Generate localised messages in four languages
    parents: [BR-07]
    priority: must
    status: baselined
    use_cases: [UC-002]
    acceptance: ["Given a released disruption, when 60 s have elapsed, then DE FR IT EN messages exist or the documented fallback is applied and flagged"]
    verification: [TC-09]
  - id: FR-012
    title: Determine target channels from the channel matrix
    parents: [BR-01, BR-03]
    priority: must
    status: baselined
    use_cases: [UC-002]
    acceptance: ["Given severity severe, when the disruption is released, then all channels of the matrix row are targeted", "Given any severity, when the dispatcher deselects the national platform, then the action is refused"]
    verification: [TC-01, TC-04]
  - id: FR-013
    title: Plain-language message variant
    parents: [BR-06]
    priority: should
    status: baselined
    acceptance: ["Given a released disruption, when the plain-language variant is generated, then it is rated B1 or simpler by the readability check"]
    verification: [TC-08]
  - id: FR-014
    title: Correct or cancel a published disruption
    parents: [BR-01, BR-02]
    priority: must
    status: baselined
    use_cases: [UC-003]
    acceptance: ["Given a published disruption, when it is corrected, then only channels currently holding the message receive the update", "Given a cancellation, when it is confirmed, then every holding channel receives a withdrawal"]
    verification: [TC-12]
  - id: FR-015
    title: Channel-specific truncation shown before release
    parents: [BR-01]
    priority: must
    status: baselined
    use_cases: [UC-001]
    acceptance: ["Given a text longer than a channel limit, when the preview is shown, then the truncation point for that channel is visible"]
    verification: [TC-01]
  - id: FR-016
    title: Deliver ordered departure rows to displays
    parents: [BR-05]
    priority: must
    status: baselined
    use_cases: [UC-004]
    acceptance: ["Given departures for a stop, when rows are delivered, then they are ordered by estimated departure time"]
    verification: [TC-06]
  - id: FR-017
    title: Countdown format rule
    parents: [BR-05]
    priority: must
    status: baselined
    use_cases: [UC-004]
    acceptance: ["Given an estimate 61 minutes ahead, when the row is rendered, then a clock time is shown instead of a countdown"]
    verification: [TC-06]
  - id: FR-018
    title: Push a disruption within 10 s of release or approval
    parents: [BR-02]
    priority: must
    status: baselined
    use_cases: [UC-002, UC-003]
    acceptance: ["Given a released disruption, when 10 s have elapsed, then every reachable target channel has received it"]
    verification: [TC-02]
  - id: FR-019
    title: Instruct a channel to show a staleness indicator
    parents: [BR-02, BR-08]
    priority: must
    status: baselined
    use_cases: [UC-003, UC-004]
    acceptance: ["Given a display unreachable for 120 s, when the threshold expires, then it shows a staleness notice instead of a countdown"]
    verification: [TC-10]
  - id: FR-020
    title: Query interface for departures and disruptions
    parents: [BR-05, BR-07]
    priority: must
    status: baselined
    acceptance: ["Given a stop and a language, when the query is issued, then departures and active disruptions are returned in that language"]
    verification: [TC-06, TC-09]
  - id: FR-021
    title: Text never delivered only as an image
    parents: [BR-06]
    priority: must
    status: baselined
    acceptance: ["Given any passenger-facing message, when it is inspected, then the full text is available as machine-readable text"]
    verification: [TC-08]
  - id: FR-022
    title: Service-desk view of current channel content
    parents: [BR-08]
    priority: should
    status: baselined
    use_cases: [UC-006]
    acceptance: ["Given a line, when an agent opens the desk view, then the current content of every channel for that line is shown"]
    verification: [TC-01]
  - id: FR-023
    title: Internal-only annotations excluded by the data model
    parents: [BR-08, BR-09]
    priority: must
    status: baselined
    use_cases: [UC-006]
    acceptance: ["Given an internal annotation, when any passenger channel payload is generated, then the annotation is absent"]
    verification: [TC-01, TC-11]
  - id: FR-024
    title: Serve SIRI-SX situation exchange
    parents: [BR-03]
    priority: must
    status: review
    use_cases: [UC-005]
    acceptance: ["Given a subscribed consumer, when a disruption state changes, then a SIRI-SX update is pushed within 10 s"]
    verification: [TC-04]
  - id: FR-025
    title: Serve SIRI-ET estimated timetable
    parents: [BR-03]
    priority: must
    status: review
    use_cases: [UC-005]
    acceptance: ["Given running trips, when 30 s have elapsed, then an ET update covering them has been pushed"]
    verification: [TC-04]
  - id: FR-026
    title: Heartbeat handling and re-subscription
    parents: [BR-03]
    priority: must
    status: review
    use_cases: [UC-005]
    acceptance: ["Given three consecutive missed heartbeats, when the third is missed, then PRISMA re-establishes the subscription"]
    verification: [TC-15]
  - id: FR-027
    title: Append-only audit entry per state change
    parents: [BR-09]
    priority: must
    status: review
    use_cases: [UC-002, UC-003, UC-007]
    acceptance: ["Given any state change, when it completes or fails, then an audit entry records actor, timestamp, channel and outcome"]
    verification: [TC-11]
  - id: FR-028
    title: Retrieve and export communication history
    parents: [BR-09]
    priority: must
    status: review
    use_cases: [UC-007]
    acceptance: ["Given a disruption within retention, when an auditor requests its history, then every version and publication attempt is returned and exportable"]
    verification: [TC-11]
  - id: FR-029
    title: Aggregate vehicle data before reporting
    parents: [BR-10]
    priority: must
    status: review
    acceptance: ["Given the reporting data mart, when its schema is inspected, then no driver or duty identifier is present"]
    verification: [TC-11]
  - id: FR-030
    title: Add a channel endpoint by configuration
    parents: [BR-05]
    priority: should
    status: review
    acceptance: ["Given an administrator, when a new display endpoint is configured, then it receives data without a software deployment"]
    verification: [TC-16]

quality_requirements:
  - id: NFR-001
    title: Publication latency
    category: performance efficiency
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Release to last channel acknowledgement <= 10 s median and <= 20 s p95 under the NFR-003 load profile"]
    verification: [TC-02]
  - id: NFR-002
    title: Authoring interaction cost
    category: performance efficiency
    parents: [BR-04]
    priority: must
    status: baselined
    acceptance: ["At most 3 interactions from an open template-based draft to released"]
    verification: [TC-05]
  - id: NFR-003
    title: Peak load
    category: performance efficiency
    parents: [BR-02, BR-05]
    priority: must
    status: baselined
    acceptance: ["412 stops, 1800 app queries per second, 40 disruption state changes per minute, 3000 estimates per minute without violating NFR-001"]
    verification: [TC-02]
  - id: NFR-004
    title: Estimate freshness
    category: performance efficiency
    parents: [BR-02]
    priority: must
    status: baselined
    acceptance: ["Age of underlying ITCS data behind a published estimate <= 30 s at p95"]
    verification: [TC-03]
  - id: NFR-005
    title: Honest degradation
    category: reliability
    parents: [BR-02, BR-08]
    priority: must
    status: baselined
    acceptance: ["Zero countdowns displayed from data older than 120 s; staleness indicator shown instead"]
    verification: [TC-10]
  - id: NFR-006
    title: Partial availability
    category: reliability
    parents: [BR-02, BR-07]
    priority: must
    status: baselined
    acceptance: ["Failure of translation, one channel adapter, or reporting does not prevent publication to remaining channels"]
    verification: [TC-10]
  - id: NFR-007
    title: Availability targets per path
    category: reliability
    parents: [BR-03]
    priority: must
    status: baselined
    acceptance: ["Publication path >= 99.7 %, national feed >= 99.5 %, desk view >= 99.0 % monthly in the 04:00-01:30 window"]
    verification: [TC-15]
  - id: NFR-008
    title: Idempotent publication
    category: reliability
    parents: [BR-01]
    priority: must
    status: baselined
    acceptance: ["A repeated release of the same disruption version produces exactly one message per channel"]
    verification: [TC-12]
  - id: NFR-009
    title: Recovery objectives
    category: reliability
    parents: [BR-03, BR-09]
    priority: must
    status: baselined
    acceptance: ["RTO <= 30 min and RPO <= 60 s demonstrated in a restore exercise"]
    verification: [TC-15]
  - id: NFR-010
    title: Authentication and authorisation
    category: security
    parents: [BR-09]
    priority: must
    status: baselined
    acceptance: ["Every state-changing operation requires the matching role; 100 % covered by authorisation tests"]
    verification: [TC-11]
  - id: NFR-011
    title: Accessibility conformance
    category: usability
    parents: [BR-06]
    priority: must
    status: baselined
    acceptance: ["No unresolved level A or AA findings in the external audit"]
    verification: [TC-08]
  - id: NFR-012
    title: Assistive technology task success
    category: usability
    parents: [BR-06]
    priority: must
    status: baselined
    acceptance: [">= 90 % task success with at least 8 daily assistive-technology users"]
    verification: [TC-08]
  - id: NFR-013
    title: Retention and deletion per data category
    category: data protection
    parents: [BR-09, BR-10]
    priority: must
    status: baselined
    acceptance: ["Audit 3 years, raw positions 24 h, aggregated KPIs 5 years, app subscriptions deleted 90 days after last use"]
    verification: [TC-11]
  - id: NFR-014
    title: Purpose limitation for vehicle data
    category: data protection
    parents: [BR-10]
    priority: must
    status: baselined
    acceptance: ["Zero driver or duty identifiers stored or exported outside the 24 h operational window"]
    verification: [TC-11]
  - id: NFR-015
    title: Comprehensibility of messages
    category: usability
    parents: [BR-06, BR-08]
    priority: should
    status: baselined
    acceptance: ["30 sampled generated messages per release rated B1 or simpler"]
    verification: [TC-08]
  - id: NFR-016
    title: Audit integrity
    category: security
    parents: [BR-09]
    priority: must
    status: baselined
    acceptance: ["Audit entries are append-only; any modification attempt is detectable"]
    verification: [TC-11]
  - id: NFR-017
    title: Channel extensibility
    category: maintainability
    parents: [BR-05]
    priority: should
    status: baselined
    acceptance: ["An administrator adds an endpoint of an existing channel type in <= 30 min without deployment"]
    verification: [TC-16]
  - id: NFR-018
    title: Conformance suite runnable in CI
    category: maintainability
    parents: [BR-03]
    priority: must
    status: baselined
    acceptance: ["The platform operator conformance suite runs in CI against staging and is green before every IF-06 release"]
    verification: [TC-04]
  - id: NFR-019
    title: Deployment environment
    category: portability
    parents: [BR-03]
    priority: must
    status: baselined
    acceptance: ["No dependency outside the approved cantonal cloud service catalogue, confirmed in architecture review"]
    verification: [TC-15]
