name: requirements-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate requirement register
        run: python tools/validate_requirements.py

      - name: Check every requirement id in docs exists in the register
        run: |
          python - <<'PY'
          import re, sys, pathlib, yaml
          reg = yaml.safe_load(open("fallstudie/requirements.yaml"))
          known = {r["id"] for section in
                   ("business_requirements", "functional_requirements", "quality_requirements")
                   for r in reg.get(section, [])}
          pattern = re.compile(r"\b(?:BR-\d{2}|FR-\d{3}|NFR-\d{3})\b")
          missing = {}
          for path in pathlib.Path(".").rglob("*.md"):
              for rid in pattern.findall(path.read_text(encoding="utf-8")):
                  if rid not in known:
                      missing.setdefault(rid, set()).add(str(path))
          if missing:
              for rid, files in sorted(missing.items()):
                  print(f"{rid} referenced in {', '.join(sorted(files))} but not in the register")
              sys.exit(1)
          print(f"All requirement references resolve. {len(known)} ids in the register.")
          PY
